<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Bloom Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-page-container">
        <!-- Left Side: Registration Form -->
        <div class="login-form-side">
            <div class="form-wrapper">
                <h1><img src="images/logo.png" alt="Logo" class="nav-logo">Create Account</h1>
                <p class="subtitle">Join the Bloom Market community</p>

                <form id="signupForm" action="home.html" method="GET">
                    <div class="input-group">
                        <label for="fullname">Full Name</label>
                        <input type="text" id="fullname" required>
                    </div>

                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="input-group">
                        <label for="address">Address</label>
                        <input type="text" id="address" required>
                    </div>

                   <!-- Password Field -->
<div class="input-group">
    <label for="password">Password</label>
    <div class="input-field-wrapper">
        <input type="password" id="password" required>
        <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>
    </div>
</div>

<!-- Confirm Password Field -->
<div class="input-group">
    <label for="confirm-password">Confirm Password</label>
    <div class="input-field-wrapper">
        <input type="password" id="confirm-password" required>
        <i class="fa-solid fa-eye-slash toggle-password" id="toggleConfirmPassword"></i>
    </div>
</div>
                    <button type="submit" class="btn-signin">Sign Up</button>
                </form>

                <p class="signup-footer">
                    Already have an account? <a href="login.html">Log in</a>
                </p>
            </div>
        </div>

        <!-- Right Side: Floral Image / Graphic -->
        <div class="login-image-side"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
