<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Bloom Market</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="login-page-container">
        <!-- Left Side: Login Form -->
        <div class="login-form-side">
            <div class="form-wrapper">
                <h1><img src="images/logo.png" alt="Logo" class="nav-logo">Hello Bloom</h1>
                <p class="subtitle">Welcome back! Please enter your details</p>

                <form id="loginForm" action="home.html" method="GET">
                    <div class="input-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" required>
                    </div>

                                      
                        <div class="input-group">
                            <label for="password">Password</label>
                            <div class="input-field-wrapper">
                                <input type="password" id="password" required>
                            <i class="fa-solid fa-eye-slash toggle-password" id="togglePassword"></i>
                     </div>
                    </div>
                    <div class="forgot-container">
                        <a href="#" class="forgot-link">Forgot password</a>
                    </div>

                    <button type="submit" class="btn-signin">Sign in</button>

                    <button type="button" class="btn-google">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo" class="google-icon">
                        Sign in with Google
                    </button>
                </form>

                <p class="signup-footer">
                    Don't have an account? <a href="registration.html">Sign up for free</a>
                </p>
            </div>
        </div>

        <!-- Right Side: Floral Image / Graphic -->
        <div class="login-image-side">
            <!-- Put your floral image here, or use a background image in CSS -->
        </div>
    </div>


  <script src="script.js"></script>
</body>
</html>
